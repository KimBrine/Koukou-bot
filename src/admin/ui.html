<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Koukou Studio · QQ 机器人工作台</title>
<style>
:root{
  color-scheme:dark;
  --bg:#080d18;--surface:#101a2b;--surface2:#152238;--surface3:#1b2b43;
  --line:#263850;--text:#eef5ff;--muted:#9aabc0;
  --accent:#6bd5c4;--accent2:#92a7ff;--ok:#5cdea8;--warn:#f4bd69;--bad:#ff8791;
  --radius:18px;--shadow:0 18px 48px rgba(0,0,0,.18)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(circle at 85% -10%,#23375a 0,transparent 36%),radial-gradient(circle at 12% 90%,#15363d 0,transparent 38%),var(--bg);color:var(--text);font:14px/1.6 "Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{transition:background .16s,border-color .16s,transform .16s}
button:active{transform:translateY(1px)}
a{color:var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
aside{background:linear-gradient(180deg,#132239 0,#0c1627 100%);border-right:1px solid var(--line);padding:26px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{font-size:20px;font-weight:800;letter-spacing:.3px;padding:2px 12px 26px;line-height:1.35}
.logo::before{content:"✦";display:inline-grid;place-items:center;width:31px;height:31px;margin-right:8px;border-radius:10px;background:linear-gradient(135deg,#68d9c7,#748eff);color:#08202c;font-size:20px;vertical-align:middle;box-shadow:0 5px 18px #58c8c955}
.logo small{display:block;margin:8px 0 0 40px;color:var(--muted);font-weight:400;font-size:11px;letter-spacing:0}
nav{display:grid;gap:4px}
nav button{width:100%;text-align:left;padding:11px 13px;border:1px solid transparent;border-radius:12px;background:transparent;color:var(--muted);cursor:pointer;font-weight:600}
nav button:hover{background:#1d3149;color:var(--text)}
nav button.on{background:linear-gradient(105deg,#25493f,#233b5f);border-color:#3a746a;color:#ebfff9;box-shadow:inset 3px 0 var(--accent)}
.sidebar-foot{margin:28px 9px 0;padding:11px 12px;border:1px solid #3a5267;border-radius:12px;color:#afc4d7;font-size:12px;background:#14273a}
.sidebar-foot .dot{vertical-align:middle}
main{min-width:0;width:100%;max-width:1390px;padding:34px clamp(18px,3vw,48px) 90px}
h1{font-size:clamp(25px,3vw,34px);font-weight:800;letter-spacing:-.5px;margin:0 0 2px;line-height:1.3}
h2{font-size:16px;font-weight:750;margin:32px 0 13px}
.sub{color:var(--muted);font-size:13px;margin:0 0 23px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card,.chat{background:linear-gradient(150deg,rgba(27,43,67,.94),rgba(15,26,44,.96));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card{padding:20px}
.card h3{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.4px;margin:0 0 10px}
.kpi{font-size:28px;font-weight:800;line-height:1.3}
.kpi small{font-size:12px;color:var(--muted);font-weight:400;margin-left:5px}
.row,.flexbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.flexbar{margin:14px 0}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:#66758c;margin-right:5px}
.dot.ok{background:var(--ok);box-shadow:0 0 12px #5cdea899}
.dot.bad{background:var(--bad);box-shadow:0 0 12px #ff879188}
.dot.warn{background:var(--warn)}
.btn{background:#1e304b;border:1px solid #344964;border-radius:11px;padding:9px 15px;cursor:pointer;min-height:38px;font-weight:650}
.btn:hover{background:#2b4060;border-color:#587496}
.btn.primary{background:linear-gradient(135deg,#3f8c8b,#4d70af);border-color:#5fcfc2;color:#fff;box-shadow:0 7px 18px #2c8c9340}
.btn.primary:hover{background:linear-gradient(135deg,#4eaaa7,#648ac9)}
.btn.danger{background:#522b39;border-color:#925260;color:#ffe4e8}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;min-height:29px;font-size:12px}
.badge{font-size:11px;padding:3px 8px;border-radius:99px;background:#25364e;color:#b6c6da;border:1px solid #3a4f6b;white-space:nowrap}
.badge.live{color:#99efd0;border-color:#3c806d;background:#173b35}
.badge.restart{color:#f3d497;border-color:#795f39;background:#463724}
.badge.whitelist{color:#bcc9ff;border-color:#4959a0;background:#263465}
.chat{margin-bottom:11px;overflow:hidden}
.chat .head{display:flex;align-items:center;gap:10px;padding:15px 18px;cursor:pointer}
.chat .head:hover{background:#20324b}
.chat .name{font-weight:750;font-size:15px}
.chat .body{padding:10px 18px 20px;border-top:1px solid var(--line);display:none}
.chat.open .body{display:block}
.frow{display:grid;grid-template-columns:minmax(150px,210px) minmax(0,1fr);gap:14px;align-items:start;padding:12px 0;border-bottom:1px solid #ffffff0c}
.frow:last-child{border-bottom:0}
.frow>label{color:#c4d1e1;padding-top:7px;font-size:13px;font-weight:650}
input[type=text],input[type=number],input[type=password],textarea,select{background:#0d192a;border:1px solid #3b4d65;border-radius:10px;padding:9px 11px;width:100%;min-height:39px}
input::placeholder,textarea::placeholder{color:#7f90a8}
textarea{min-height:90px;resize:vertical;line-height:1.55}
input[type=range]{width:min(260px,100%);accent-color:var(--accent)}
input[type=checkbox]{accent-color:#69d8c5}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.switch input{display:none}
.switch i{width:42px;height:24px;border-radius:14px;background:#3a4860;position:relative;transition:.15s;display:inline-block}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#becbdb;transition:.15s}
.switch input:checked+i{background:#3a9c8e}
.switch input:checked+i::after{left:21px;background:#fff}
.mut{color:var(--muted)}
.mono{font-family:Consolas,"Cascadia Mono",monospace;font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.logbox{background:#07111e;border:1px solid var(--line);border-radius:12px;padding:14px;max-height:510px;overflow:auto}
.logbox .l{white-space:pre-wrap;overflow-wrap:anywhere;padding:4px 0;border-bottom:1px solid #ffffff0a}
.toast{position:fixed;right:22px;bottom:22px;background:#21334e;border:1px solid #4b6786;border-left:4px solid var(--accent);padding:13px 17px;border-radius:12px;opacity:0;transform:translateY(12px);transition:.2s;pointer-events:none;max-width:min(440px,calc(100vw - 36px));z-index:20;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:none}
.pill{font-size:12px;padding:4px 10px;border-radius:20px;background:#203a4b;border:1px solid #3e6972;color:#b6f1e3}
table{width:100%;border-collapse:collapse}
td,th{padding:11px 10px;border-bottom:1px solid #ffffff16;text-align:left;font-size:13px}
th{color:#afc1d6;font-weight:700}
tr:last-child td{border-bottom:0}
.empty{color:var(--muted);padding:18px 4px}
.hero{background:linear-gradient(115deg,#173d43,#233a66 68%,#463d68);border:1px solid #4c8290;border-radius:22px;padding:26px 29px;margin-bottom:22px;box-shadow:var(--shadow)}
.hero h1{font-size:29px}
.hero .sub{color:#c4d8e7;margin:5px 0 0}
.hero-status{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;background:#08292699;border:1px solid #6bd5c466;color:#adffe7;font-weight:700;font-size:12px;margin-bottom:12px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.note{font-size:12px;color:#adc0d4;line-height:1.55}
.warnline{padding:11px 14px;background:#4b3724;border:1px solid #8e6a3b;border-radius:11px;color:#ffdeab;margin:12px 0}
.toolgroup{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}
.toolgroup.advanced{padding-top:13px;border-top:1px solid var(--line)}
details.advanced-box{margin-top:10px;color:var(--muted)}
details.advanced-box summary{cursor:pointer;font-weight:650}
.sticky-save{position:sticky;bottom:12px;background:#1b2b44ee;border:1px solid #536d8b;border-radius:13px;padding:10px 14px;z-index:5;backdrop-filter:blur(12px)}
.modal-backdrop{position:fixed;inset:0;background:#020914ad;display:none;align-items:center;justify-content:center;padding:20px;z-index:30}
.modal-backdrop.show{display:flex}
.modal{width:min(520px,100%);background:#17253a;border:1px solid #526a87;border-radius:20px;padding:25px;box-shadow:0 30px 90px #0008}
.modal h2{font-size:21px;margin:0 0 8px}
.modal p{color:var(--muted);margin:0 0 18px}
.modal textarea{min-height:110px;margin-bottom:15px}
.modal .row{justify-content:flex-end}
.group-manager{border-color:#3d686e;margin-bottom:24px}
.group-manager .section-head{flex-wrap:wrap;align-items:flex-start}
.group-manager h2,.rate-editor h2{margin:0;font-size:18px}
.group-list{display:grid;gap:9px;margin-top:16px}
.group-item{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:13px 15px;background:#0d192a;border:1px solid var(--line);border-radius:12px}
.group-identity{flex:1;min-width:140px;overflow-wrap:anywhere}
.group-identity strong{display:block;font-size:14px}
.group-identity small{display:block;color:var(--muted);font-size:12px}
.rate-percent{display:flex;align-items:center;gap:6px;white-space:nowrap}
.rate-percent input{width:88px}
.rate-add{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:15px;padding-top:15px;border-top:1px solid var(--line)}
.rate-add select{flex:1;min-width:180px}
.rate-add input{width:180px}
.modal.wide{width:min(620px,100%);max-height:90vh;overflow:auto}
.modal label.field-label{display:block;margin:16px 0 7px;font-weight:650}
.modal .import-preview{max-height:200px;overflow:auto;margin:12px 0 18px;border-top:1px solid var(--line);padding-top:10px}
.modal .preview-line{display:flex;gap:10px;justify-content:space-between;padding:5px 0;font-size:13px;overflow-wrap:anywhere}
.inline-error{color:var(--bad);margin:8px 0;font-size:12px}
@media(max-width:1100px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:780px){
  .app{display:block}
  aside{position:sticky;z-index:10;width:100%;height:auto;padding:10px 13px 8px;background:#101b2cef;backdrop-filter:blur(18px);border-right:0;border-bottom:1px solid var(--line)}
  .logo{padding:0 4px 8px;font-size:16px}
  .logo::before{width:25px;height:25px;font-size:16px;border-radius:8px}
  .logo small{display:none}
  nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
  nav button{width:auto;white-space:normal;padding:7px 4px;font-size:12px;line-height:1.25;text-align:center}
  nav button.on{box-shadow:inset 0 -3px var(--accent)}
  main{padding:22px 16px 70px}
  .hero{padding:21px}
  .hero h1{font-size:24px}
  .g3,.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .frow{grid-template-columns:1fr;gap:3px}
  .frow>label{padding-top:0}
  .chat .head{flex-wrap:wrap}
}
@media(max-width:560px){.g3,.g2{grid-template-columns:1fr}.card{padding:16px}.chat .head .mut{font-size:11px}.toolgroup .btn{flex:1 1 150px}}

</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="logo">Koukou Studio<small>QQ 机器人工作台 · 本地版</small></div>
    <nav id="nav"></nav>
    <div class="sidebar-foot"><span class="dot" id="sideDot"></span><span id="sideStatus">正在连接</span></div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<div class="modal-backdrop" id="modalRoot" aria-hidden="true"></div>

<script src="/command-center.js"></script>
<script>
const PAGES = [
  ['overview','◈  工作台'],
  ['chats','◎  会话管理'],
  ['commands','⌘  指令中心'],
  ['persona','✧  人格编辑'],
  ['humanize','◉  回复行为'],
  ['api','⌘  模型与接口'],
  ['report','▤  群聊报告'],
  ['memory','▤  记忆浏览'],
  ['stickers','☺  表情包'],
  ['logs','≡  运行日志'],
  ['data','▦  数据与记忆'],
]
let page = location.hash.replace('#','') || 'overview'
if (!PAGES.some(p => p[0] === page)) page = 'overview'
let state = null
let chats = []
let configItems = []
let personas = []
let activePersona = ''
let selectedPersona = ''
let openChats = new Set()
let logAuto = true
let logFilter = ''
let joinedGroups = []
let memoryOverview = []
let memoryViewKey = ''
let memoryText = ''
let customCommands = []
let commandBuiltins = []
let pokeDiagnostics = {}
let modelsInfo = {}
let modelsAvailable = (function(){ try { return JSON.parse(localStorage.getItem('koukou_models') || '[]') } catch (e) { return [] } })()
let stickerList = []
let stickerScenes = []
let stickerLearned = 0
let stickerLearn = {}
let stickerSettings = {}

const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild }
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
const api = async (path, body) => {
  const opt = body ? { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) } : {}
  const r = await fetch(path, opt)
  const j = await r.json().catch(() => ({}))
  if (!r.ok || j.error) throw new Error(j.error || ('HTTP ' + r.status))
  return j
}
function toast(msg, bad) {
  const t = document.getElementById('toast')
  t.textContent = msg
  t.style.borderLeftColor = bad ? 'var(--bad)' : 'var(--accent)'
  t.classList.add('show')
  clearTimeout(t._t)
  t._t = setTimeout(() => t.classList.remove('show'), bad ? 4200 : 2200)
}
function ask(title, description, button = '确认', textInput = false) {
  return new Promise(resolve => {
    const root = document.getElementById('modalRoot')
    root.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><h2></h2><p></p>' +
      (textInput ? '<textarea id="modalInput" placeholder="输入要发送的内容"></textarea>' : '') +
      '<div class="row"><button class="btn" id="modalCancel">取消</button><button class="btn primary" id="modalOk"></button></div></div>'
    root.querySelector('h2').textContent = title
    root.querySelector('p').textContent = description
    root.querySelector('#modalOk').textContent = button
    root.classList.add('show')
    root.setAttribute('aria-hidden', 'false')
    const close = value => {
      root.classList.remove('show')
      root.setAttribute('aria-hidden', 'true')
      root.innerHTML = ''
      document.removeEventListener('keydown', onKey)
      resolve(value)
    }
    const onKey = ev => { if (ev.key === 'Escape') close(null) }
    document.addEventListener('keydown', onKey)
    root.onclick = ev => { if (ev.target === root) close(null) }
    root.querySelector('#modalCancel').onclick = () => close(null)
    root.querySelector('#modalOk').onclick = () => {
      const value = textInput ? root.querySelector('#modalInput').value.trim() : true
      if (textInput && !value) return
      close(value)
    }
    ;(root.querySelector('#modalInput') || root.querySelector('#modalOk')).focus()
  })
}
const fmtUptime = (s) => { const d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60); return (d?d+'天':'')+(h?h+'小时':'')+m+'分' }
const fmtTime = (ms) => ms ? new Date(ms).toLocaleTimeString('zh-CN',{hour12:false}) : '—'

// ── 导航 ───────────────────────────────────────────────
function renderNav(){
  const nav = document.getElementById('nav')
  nav.innerHTML = ''
  PAGES.forEach(([id,label]) => {
    const b = $('<button>' + label + '</button>')
    if (id === page) b.classList.add('on')
    b.onclick = () => { page = id; location.hash = id; renderNav(); render() }
    nav.appendChild(b)
  })
}

// ── 页面：总览 ──────────────────────────────────────────
function accountStatusText(b = {}) {
  if (b.online === true) return '机器人在线'
  if (b.qqOnline === false) return 'QQ 已离线'
  if (b.qqGood === false) return 'QQ 服务异常'
  if (b.statusError === '控制台未响应') return '控制台未响应'
  if (!b.onebotConnected) return 'OneBot 未连接'
  if (b.reportedOnline === true) return b.statusError ? 'QQ 连接异常（待核验）' : 'QQ 连接核验中'
  return 'QQ 状态未确认'
}
function updateSideStatus(b = {}) {
  const dot = document.getElementById('sideDot')
  const label = document.getElementById('sideStatus')
  if (dot) dot.className = 'dot ' + (b.online === true ? 'ok' : 'bad')
  if (label) label.textContent = accountStatusText(b) + (b.selfId ? ' · ' + b.selfId : '')
}
function pageOverview(){
  const b = state?.bot ?? {}
  const c = state?.counters ?? {}
  const t = state?.today ?? {}
  const dot = (ok) => '<span class="dot ' + (ok ? 'ok' : 'bad') + '"></span>'
  const cards = [
    ['OneBot 连接', (b.onebotConnected ? dot(true) + ' 已连接' : dot(false) + ' 未连接'), b.onebotUrl],
    ['QQ 账号', dot(b.online === true) + ' ' + accountStatusText(b), esc(b.nickname || '') + (b.selfId ? (' · QQ ' + b.selfId) : '') + (b.probeCheckedAt ? (' · ' + new Date(b.probeCheckedAt).toLocaleTimeString('zh-CN',{hour12:false}) + ' 实际连接核验') : '') + (b.statusError ? ' · ' + esc(b.statusError) : '')],
    ['NapCat 服务端口', b.napcatPort ? (dot(true) + ' 已监听') : (dot(false) + ' 未开放'), '端口 ' + (b.napcatPortNumber || '—')],
    ['对话模型', esc(b.model || '—'), b.webSearch ? '联网搜索已启用' : '联网搜索未启用'],
    ['视觉模型', b.visionModel ? esc(b.visionModel) : '未启用', b.visionModel ? '带图消息自动识图' : '未配置视觉 API Key'],
    ['已运行', fmtUptime(state?.uptimeSec || 0), 'PID ' + (state?.pid ?? '—')],
    ['今日已记录消息', (t.total ?? 0) + ' 条', '自本次启动：收到 ' + (c.received||0) + ' / 回复 ' + (c.replied||0)],
  ]
  const perGroup = (t.perGroup || []).map(g => {
    const chat = chats.find(x => String(x.id) === String(g.groupId))
    return '<tr><td>' + esc(chat?.name || ('群 ' + g.groupId)) + '</td><td class="mut">' + g.groupId + '</td><td>' + g.count + '</td></tr>'
  }).join('')
  const admins = (state?.config?.adminUsers || [])
  const adminCard = [
    '<section class="card" style="margin-bottom:18px"><h2>管理员（最高权限）</h2>',
    '<div class="note">配置群总结与清除记忆等指令的管理员 QQ 号，逗号分隔，保存后立即生效。/help 人人可用；清除记忆要求显式管理员授权。id_check 还需符合对应群与操作员规则。</div>',
    '<div class="flexbar"><input type="text" id="adminUsersInput" style="flex:1" placeholder="例如：200000011,200000012" value="' + esc(admins.join(',')) + '">',
    '<button class="btn primary" id="adminUsersSave">保存管理员</button></div>',
    '<div class="mut" style="margin-top:8px">当前管理员：' + (admins.length ? admins.map(esc).join('、') : '未配置（群总结等沿用公开范围；清除记忆须显式配置管理员）') + '</div>',
    '</section>'
  ].join('')
    return adminCard + `
  <div class="hero"><span class="hero-status">${dot(b.online === true)} ${accountStatusText(b)}</span>
    <h1>机器人工作台</h1><div class="sub"><span id="updatedAt">${new Date().toLocaleTimeString('zh-CN',{hour12:false})}</span> 更新 · 集中管理运行状态与操作</div></div>
  <div class="grid g3">${cards.map(([k,v,s]) => `<div class="card"><h3>${k}</h3><div class="kpi">${v}</div><div class="note">${s||''}</div></div>`).join('')}</div>
  <div class="section-head"><h2>常用操作</h2><span class="note">操作作用于当前机器人</span></div>
  <div class="card">
    <div class="toolgroup"><button class="btn primary" data-act="poke-target">检查盯人目标</button>
      <button class="btn" data-act="summary">生成群聊报告</button>
      <button class="btn" data-act="clear-alert">清除掉线提醒</button></div>
    <details class="advanced-box"><summary>维护与定时指令</summary>
      <div class="toolgroup advanced"><button class="btn" data-act="restart-bot">重启机器人</button>
        <button class="btn" data-act="restart-napcat">重启 NapCat</button>
        <button class="btn" data-act="daily-ping">立即发定时指令 (@示例机器人)</button></div>
    </details>
  </div>
  <div class="section-head"><h2>今日各群已记录消息</h2><span class="note">本地记录，供运行监测</span></div>

function downloadPersonaFile(filename, content){
  const blob = new Blob(['\uFEFF', String(content)], {type:'text/plain;charset=utf-8'})
  const url = URL.createObjectURL(blob)
  const link = document.createElement('a')
  link.href = url; link.download = filename; document.body.appendChild(link)
  link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000)
}
async function readPersonaFile(file){
  if (!/\.(txt|md)$/i.test(file.name)) throw Error('请选择 .txt 或 .md 人格文件')
  if (file.size > 262144) throw Error('人格文件不能超过 256 KB')
  const bytes = new Uint8Array(await file.arrayBuffer())
  let content
  if (bytes[0] === 0xff && bytes[1] === 0xfe) content = new TextDecoder('utf-16le').decode(bytes)
  else if (bytes[0] === 0xfe && bytes[1] === 0xff) content = new TextDecoder('utf-16be').decode(bytes)
  else {
    try { content = new TextDecoder('utf-8', {fatal:true}).decode(bytes) }
    catch { content = new TextDecoder('gb18030').decode(bytes) }
  }
  content = content.replace(/^\uFEFF/, '')
  if (!content.trim() || content.includes('\u0000')) throw Error('文件为空或不是可读取的纯文本人格')
  return content
}
function suggestPersonaName(filename){
  const stem = filename.replace(/\.(txt|md)$/i, '')
  const match = /^Koukou-(.+?)-人格(?:-\d{4}-\d{2}-\d{2})?$/.exec(stem)
  const base = (match?.[1] || stem).replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_').replace(/[. ]+$/, '').slice(0, 50) || '导入人格'
  let name = base, number = 2
  const names = new Set(personas.map(p => p.name.toLowerCase()))
  while (names.has(name.toLowerCase())) name = `${base}（${number++}）`
  return name
}

    commit.disabled = !!invalid.length || !newIds.length
    commit.textContent = newIds.length && !invalid.length ? `添加 ${newIds.length} 个白名单群` : ids.length && !invalid.length ? '这些群已在白名单中' : '请先选择或输入群号'
  }
  input.oninput = preview
  root.querySelector('#whitelistPick').onchange = ev => {
    if (!ev.target.value) return
    input.value = input.value.trim() + (input.value.trim() ? '\n' : '') + ev.target.value
    ev.target.value = ''; preview()
  }
  commit.onclick = async () => {
    preview(); if (commit.disabled) return
    pending = true; commit.disabled = true; commit.textContent = '正在添加…'
    try { const result = await api('/api/action/update-whitelist', {operation:'add', groupIds:newIds}); pending = false; close(); await load(); toast(`已添加 ${result.changed} 个白名单群，即时生效`) }
    catch(e){ pending = false; preview(); toast('添加失败：' + e.message, true) }
  }
  preview(); root.querySelector('#whitelistPick').focus()
}
function configForm(keys, hint){
  const items = configItems.filter(i=>keys.includes(i.key))
  return items.map(i => {
    const v = i.effective !== '' ? i.effective : i.value
    const badge = i.live ? '<span class="badge live">即时生效</span>' : '<span class="badge restart">需重启</span>'
    let input
    if (i.key === 'PROACTIVE_RATE_PER_GROUP') input = groupRateEditor(v)
    else if (i.type === 'bool') input = `<label class="switch"><input type="checkbox" data-cfg="${i.key}" ${(v==='1'||v==='true')?'checked':''}><i></i></label>`
    else if (i.type === 'rate') input = `<input type="range" min="0" max="1" step="0.01" data-cfg="${i.key}" value="${v||0}"> <span class="pill" data-cfgshow="${i.key}">${((Number(v)||0)*100).toFixed(0)}%</span>`
    else if (i.type === 'secret') input = `<div class="row"><input type="password" data-cfg="${i.key}" data-secret="1" value="" placeholder="${i.configured ? '已设置，留空不修改' : '尚未设置'}" autocomplete="new-password" style="flex:1;min-width:180px"><button class="btn sm" type="button" data-reveal="${i.key}">显示输入</button></div>`
    else if (i.key === 'VISION_PROVIDER' || i.key === 'SUMMARY_PROVIDER') input = `<select data-cfg="${i.key}"><option value="deepseek" ${v==='deepseek'?'selected':''}>DeepSeek</option><option value="dashscope" ${v==='dashscope'?'selected':''}>DashScope（通义千问）</option></select>`
    else if (i.key === 'SUMMARY_SEND_MODE') input = `<select data-cfg="${i.key}"><option value="forward" ${v==='forward'?'selected':''}>合并转发卡片</option><option value="split" ${v==='split'?'selected':''}>按空行逐段发送</option></select>`
    else if (i.key === 'LOG_LEVEL') input = `<select data-cfg="${i.key}"><option value="debug" ${v==='debug'?'selected':''}>详细调试</option><option value="info" ${v==='info'?'selected':''}>正常信息</option><option value="warn" ${v==='warn'?'selected':''}>只看警告与错误</option><option value="error" ${v==='error'?'selected':''}>只看错误</option></select>`

    const fieldHint = ['SUMMARY_SEND_MODE','LOG_LEVEL'].includes(i.key) ? '' : (i.hint||'')

  }).join('') + `<div class="flexbar sticky-save"><button class="btn primary" id="saveCfg" disabled>没有待保存的改动</button><span class="mut" id="cfgDirty">${hint||''}</span></div>`

function render(){

  if (page === 'overview') html = pageOverview()

  else if (page === 'persona') html = pagePersona()
  else if (page === 'humanize') html = pageHumanize()
  else if (page === 'api') html = pageApi()
  else if (page === 'report') html = pageReport()
  else if (page === 'memory') html = pageMemory()
  else if (page === 'stickers') html = pageStickers()
  else if (page === 'logs') html = pageLogs()
  else html = pageData()

async function bind(){
  document.querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
    const act = b.dataset.act
    if (act === 'summary') { await doSummary(); return }
    const prompts = {
      'restart-bot': ['重启机器人？', '机器人会短暂离线，然后由计划任务重新启动。', '重启'],
      'restart-napcat': ['重启 NapCat？', 'QQ 连接会中断一会儿，机器人在恢复连接后继续工作。', '重启'],
      'daily-ping': ['立即发送定时指令？', '这会立刻以机器人身份发送 @示例机器人 指令。', '发送'],
    }
    if (prompts[act] && !await ask(...prompts[act])) return
    b.disabled = true
    try { const r = await api('/api/action/' + act, {}); toast('已执行：' + act + (r.needRestart ? '（需重启）' : '')) }
    catch(e){ toast('失败：' + e.message, true) }
    b.disabled = false
  })

  // 折叠
  document.querySelectorAll('.chat .head').forEach(h => h.onclick = (ev) => {
    if (ev.target.closest('button')) return
    const box = h.parentElement
    box.classList.toggle('open')
    const k = box.dataset.key
    box.classList.contains('open') ? openChats.add(k) : openChats.delete(k)
  })
  // 滑块实时显示

      toast(`已保存 ${r.changed} 项（即时生效 ${r.live} 项）${r.needRestart ? '，其余项目重启后生效' : ''}`)
      await load()
    } catch(e){ toast('保存失败：' + e.message, true); sc.disabled = false }
  }

  // 日志
  const lf = document.getElementById('logFilter')
  if (lf) lf.onchange = () => { logFilter = lf.value; refreshLogs() }
  const la = document.getElementById('logAuto')
  if (la) la.onchange = () => { logAuto = la.checked }
  const ll = document.getElementById('logLines')
  if (ll) ll.onchange = () => refreshLogs()

  // 数据
  const lm = document.getElementById('loadMem')
  if (lm) lm.onclick = async () => {
    const key = document.getElementById('memKey').value
    const r = await api('/api/memory?key=' + encodeURIComponent(key))
    showMemory(key + ' 最近 ' + r.items.length + ' 条', r.items)
  }
  const llm = document.getElementById('loadLm')
  if (llm) llm.onclick = async () => {
    const key = document.getElementById('lmKey').value
    const r = await api('/api/longmemory?key=' + encodeURIComponent(key) + '&q=' + encodeURIComponent(document.getElementById('lmQuery').value))
    document.getElementById('lmBox').textContent = r.text || '（这个会话还没有长期记忆摘要）'
  }
  const ds = document.getElementById('doSummary')
  if (ds) ds.onclick = doSummary
}
function showMemory(title, items){
  const html = items.map(m => `<div style="margin-bottom:7px"><span class="badge">${m.role === 'assistant' ? '机器人' : '群友'}</span> ${esc(m.content)}</div>`).join('')
  const box = document.getElementById('memBox')
  if (box) box.innerHTML = '<div class="mut" style="margin-bottom:8px">' + esc(title) + '</div>' + (html || '<div class="empty">空</div>')
  else { const d = document.createElement('div'); d.className='card mono'; d.innerHTML = '<b>'+esc(title)+'</b><br>'+html; document.getElementById('main').appendChild(d) }
}
async function doSummary(){
  const groupId = document.getElementById('sumGroup') ? document.getElementById('sumGroup').value : null
  const days = Number(document.getElementById('sumDays')?.value || 1)
  if (!await ask('生成并发送群聊报告？', '目标：' + (groupId ? '群 ' + groupId : '配置中的所有目标群') + '，范围：近 ' + days + ' 天。生成完成后会直接发送。', '开始生成')) return
  try { const r = await api('/api/action/summary', { groupId, days }); toast('已开始生成（群 ' + (r.groups||[]).join(',') + '），约 1~3 分钟') }
  catch(e){ toast(e.message, true) }
}
async function refreshLogs(){
  try {
    const lines = document.getElementById('logLines')?.value || 200
    const r = await api('/api/logs?lines=' + lines + '&filter=' + encodeURIComponent(logFilter))
    const bot = document.getElementById('logBot')
    if (bot) { bot.innerHTML = r.bot.map(l => '<div class="l">' + esc(l) + '</div>').join('') || '<div class="empty">暂无日志</div>'; bot.scrollTop = bot.scrollHeight }
  } catch(e){ /* 静默 */ }
}
async function loadDaily(){
  try {
    const r = await api('/api/daily')
    const html = r.items.length
      ? '<table><tr><th>群</th><th>日期</th><th>大小</th></tr>' + r.items.map(i => `<tr><td>${esc((chats.find(c=>String(c.id)===String(i.groupId))||{}).name || i.groupId)}</td><td>${i.date}</td><td>${(i.size/1024).toFixed(1)} KB</td></tr>`).join('') + '</table>'
      : '<div class="empty">暂无日报数据文件</div>'
    const a = document.getElementById('dailyList'); if (a) a.innerHTML = html
    const b = document.getElementById('dailyFiles'); if (b) b.innerHTML = html
  } catch(e){ /* 静默 */ }
}

// ── 数据加载 ───────────────────────────────────────────
let personaCache = {}
let appendixText = ''
async function load(){
  try {
    const [s, c, p, cfg, groups, cc, models, stk] = await Promise.all([api('/api/state'), api('/api/chats'), api('/api/personas'), api('/api/config'), api('/api/groups').catch(() => ({items:[]})), api('/api/custom-commands').catch(()=>({items:[]})), api('/api/models').catch(()=>({})), api('/api/stickers').catch(()=>({items:[]}))])
    state = s; chats = c.items; personas = p.items; activePersona = p.active; configItems = cfg.items
    joinedGroups = groups.items || []
    customCommands = cc.items || []
    commandBuiltins = cc.builtinItems || []
    pokeDiagnostics = cc.poke || {}
    modelsInfo = models || {}
    stickerList = stk.items || []
    stickerScenes = stk.scenes || []
    stickerLearned = stk.learned || 0
    stickerLearn = stk.learn || {}
    stickerSettings = stk.settings || {}
    updateSideStatus(s.bot)
    // 预取人格内容与附加说明
    for (const item of personas) {
      if (personaCache[item.name] === undefined) {
        const r = await api('/api/action/get-persona', { name: item.name }).catch(()=>({ content:'' }))
        personaCache[item.name] = r.content ?? ''
      }
    }
    if (!appendixText) {
      const r = await api('/api/action/get-appendix').catch(()=>({ text:'' }))
      appendixText = r.text ?? ''
    }
    memoryOverview = (await api('/api/memory-overview').catch(()=>({items:[]}))).items || []
    render()
  } catch(e){ updateSideStatus({ statusError:'控制台未响应' }); toast('加载失败：' + e.message + '（机器人可能在重启）', true) }
}
renderNav()
load()
// 支持浏览器前进/后退与直接改地址栏（#chats 这类）
window.addEventListener('hashchange', () => {
  const p = location.hash.replace('#', '')
  if (PAGES.some((x) => x[0] === p) && p !== page) {
    page = p
    renderNav()
    render()
  }
})
let refreshingState = false
async function refreshStateUI() {
  if (refreshingState) return
  refreshingState = true
  try {
    state = await api('/api/state')
    updateSideStatus(state.bot)
    if (page === 'commands') { const r=await api('/api/custom-commands'); CommandCenterUI.updateDiagnostics(r.poke) }
    if (page === 'overview') {
      // 正在输入时不要重绘：每 3 秒一次的全页重绘会把还没保存的输入清掉
      const mainEl = document.getElementById('main')
      const focused = document.activeElement
      const typing = focused && mainEl?.contains(focused) && /^(INPUT|TEXTAREA|SELECT)$/.test(focused.tagName)
      const adminBox = document.getElementById('adminUsersInput')
      const dirtyAdmin = adminBox && adminBox.value.trim() !== (state?.config?.adminUsers || []).join(',')
      if (typing || dirtyAdmin) return
      const oldY = window.scrollY
      const detailsOpen = document.querySelector('.advanced-box')?.open
      render()
      const details = document.querySelector('.advanced-box')
      if (details) details.open = Boolean(detailsOpen)
      window.scrollTo(0, oldY)
    }
  } catch(e) {
    state = { ...state, bot:{ ...state?.bot, online:false, connected:false, onebotConnected:false, qqOnline:null, statusError:'控制台未响应' } }
    updateSideStatus(state.bot)
    if (page === 'overview') render()
  } finally { refreshingState = false }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshStateUI() })
setInterval(() => {
  if (document.hidden) return
  refreshStateUI()
  if (page === 'logs' && logAuto) refreshLogs()
}, 3000)
</script>
