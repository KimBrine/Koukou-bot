[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "koukou-bot"
version = "0.1.0a1"
description = "Native Python backend migration of Koukou Studio"
requires-python = ">=3.11"
license = "GPL-3.0-only"
dependencies = ["aiohttp>=3.11,<4"]

[project.optional-dependencies]
images = ["Pillow>=12,<13"]

[project.scripts]
koukou = "koukou.__main__:main"

[tool.setuptools.packages.find]
where = ["python"]
include = ["koukou*"]

[tool.setuptools.package-data]
koukou = ["*.json", "*.ps1", "assets/*.json", "assets/admin/*", "assets/plugins/*.py"]

[tool.setuptools.cmdclass]
build_py = "build_support.BuildPy"
